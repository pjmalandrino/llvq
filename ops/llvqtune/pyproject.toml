[project]
name = "llvqtune"
version = "0.1.0"
description = "Trains the free parameters a quantized LLVQ artifact already holds"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
torch = [
    "torch>=2.5",
    "safetensors>=0.4",
    "transformers>=4.44",
    "pyarrow>=16",
    "huggingface-hub>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llvqtune"]

[tool.pytest.ini_options]
testpaths = ["tests"]
