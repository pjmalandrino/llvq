[project]
name = "llvq-tetra"
version = "0.1.0"
description = "Read a Tetra-quantized LLVQ model in transformers, still compressed in memory"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0 OR MIT"
license-files = ["LICENSE-APACHE", "LICENSE-MIT"]
authors = [{ name = "Pier-Jean Malandrino" }]
keywords = [
  "quantization",
  "leech-lattice",
  "vector-quantization",
  "transformers",
  "llm",
  "metal",
  "cuda",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Environment :: GPU :: NVIDIA CUDA",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
]
# Two classifiers were dropped before the first build rather than after.
# "Typing :: Typed" needs a `py.typed` marker and a type checker that runs;
# neither exists here. "Programming Language :: Rust" describes the repository,
# not this distribution, which is pure Python. A classifier is a claim.
# The reader alone is numpy and safetensors. `PackedModel` opens a packed
# directory and rebuilds a matrix without torch, which is what lets a checker
# verify the format without an accelerator.
# torch and transformers are required, not an extra: the package exists to load
# a model in `transformers`, and the model card's one line is
# `pip install llvq-tetra`. The floors are the versions measured, torch 2.14.1
# and transformers 5.17.0 and 5.18.0; torch 2.5.1 is known to break against
# transformers 5.x, which calls `torch.accelerator`.
dependencies = [
    "numpy>=2.0",
    "safetensors>=0.4",
    "torch>=2.14",
    "transformers>=5.17",
]

[project.urls]
Homepage = "https://github.com/pjmalandrino/llvq"
Repository = "https://github.com/pjmalandrino/llvq"
Issues = "https://github.com/pjmalandrino/llvq/issues"
"Model (safetensors)" = "https://huggingface.co/Pier-Jean/Qwen3-4B-LLVQ-Tetra"
"Model (sealed)" = "https://huggingface.co/Pier-Jean/Qwen3-4B-LLVQ-Tetra-sealed"

[dependency-groups]
# `ninja` is what `torch.utils.cpp_extension.load` shells out to for the Metal
# and CUDA ops. A user who never sets LLVQ_HF_FUSED=1 does not need it.
dev = ["pytest>=8", "ninja>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llvq_tetra"]

[tool.hatch.build.targets.sdist]
# The tests and their fixtures travel in the sdist: `fixtures/mini` is a 148 KB
# one-layer Qwen3 and it is the only object that exercises `from_pretrained`
# without fetching 1.4 GB, so a packager who runs the suite can.
include = ["llvq_tetra", "tests", "README.md", "LICENSE-APACHE", "LICENSE-MIT"]

[tool.pytest.ini_options]
testpaths = ["tests"]
