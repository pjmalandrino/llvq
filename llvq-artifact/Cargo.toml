[package]
name = "llvq-artifact"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The LLVQ 2-bit artifact format: packed Leech lattice indices, and the decoder that turns them back into weights."

[dependencies]
llvq-core = { path = "../llvq-core" }
llvq-search = { path = "../llvq-search" }
llvq-quant = { path = "../llvq-quant" }
# Intentionally no external dependencies. Reading a quantized model must not
# require a tensor runtime, an error crate, or anything else a reviewer would
# have to audit — the decoder is the part a sceptical reader wants to check
# line by line.
