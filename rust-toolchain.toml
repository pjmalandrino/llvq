# The compiler is a measurement parameter, and it was not pinned as one.
#
# `ops/Dockerfile.cuda:28` installs `rustup ... --profile minimal` WITHOUT
# naming a toolchain: every image rebuild embedded whatever stable was current
# that day. As long as the repository published only byte counts, that did not
# matter. Byte counts are host-side counters and do not move from one rustc
# version to the next. But the benchmark publishes TIME RATIOS, and its enqueue
# path costs 1.85 µs per launch against ~22 µs of GPU work per matrix. That
# is a 12× margin. It hides the launch cost, it is not infinite, and it has
# never faced a compiler change.
#
# WARNING: this pins FORWARD, not backward. The version used for the published
# run of 2026-08-07 is unknowable. The Dockerfile did not name it and the log
# does not print it. 1.95.0 is simply the version on the dev machine at the
# moment of pinning, so the only one we can verify. What this file guarantees
# is that FUTURE measurements share a compiler, not that they recover
# yesterday's.
#
# Placed 2026-08-10, at the start of the kernel comparison campaign.
[toolchain]
channel = "1.95.0"
profile = "minimal"
components = ["clippy", "rustfmt"]
