[package]
name = "llvq-metal"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Metal micro-benchmarks for the LLVQ fused kernel: what decoding a Leech block actually costs on a GPU."

[dependencies]
llvq-core = { path = "../llvq-core" }
llvq-search = { path = "../llvq-search" }
# Unconditional on purpose: `p1host` compiles on every platform and now names
# `llvq_artifact::blockrec`. The artifact crate has no external dependency of
# its own, so this costs the resolver nothing off macOS either.
llvq-artifact = { path = "../llvq-artifact" }

# Test-only, and only for the Tetra decoder gate: the rank tables the MSL
# decoder reads are built by `llvq_bench::f1::rank`, the same builder the CUDA
# bench uploads from. A dev-dependency, so nothing enters the shipped graph,
# and no cycle: `llvq-bench` does not name this crate.
[dev-dependencies]
llvq-bench = { path = "../llvq-bench" }

# Apple-only by construction. The rest of the workspace stays portable; this
# crate exists precisely to answer a question about one GPU.
[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.29"
