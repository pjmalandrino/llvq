# Continuous integration for the CPU half of the workspace.
#
# The repo advertises two properties a reviewer can check mechanically: "zéro
# warning clippy" (CLAUDE.md, Conventions) and a doctrine of lethal tests (hard rule 10). Neither
# was enforced anywhere until now, and the first machine to compile a pushed
# tree was a *paid* Hugging Face Space builder. This moves that first compile
# onto a free runner — and no further. Nothing here publishes, deploys, or
# spends.
#
# ============================================================================
# WHAT A GREEN CHECK HERE DOES **NOT** MEAN
# ============================================================================
# It covers 7 of the 9 crates. A GitHub-hosted runner has no GPU and no CUDA
# toolkit, so the two GPU crates cannot be *compiled* here at all. That is a
# structural limit, not a policy choice, and it was measured on 2026-08-08 on
# the dev Mac (which has the Linux std target installed) rather than assumed:
#
#   cargo check --target x86_64-unknown-linux-gnu -p llvq-metal --all-targets
#     -> exit 101, llvq-metal/src/lib.rs:728
#        compile_error!("llvq-metal targets Apple GPUs; there is nothing to
#        measure elsewhere")
#
#   cargo check --target x86_64-unknown-linux-gnu -p llvq-cuda
#     -> exit 101, cudarc-0.19.8/build.rs:168, "`nvcc --version` failed".
#        llvq-cuda/Cargo.toml documents at length why cudarc is *target*-gated
#        and not feature-gated: features resolve on the host too, so no flag
#        can hide it from the resolver on Linux.
#
# So this workflow says nothing whatsoever about:
#
#   * the fused kernel — `Slot32`, `Planes14`, the 2,03-2,09x and the 4,804
#     b/weight — on either backend;
#   * llvq-llm's `metal`, `cuda` and `cudnn` features, i.e. every code path
#     `bin/fusedrun` actually takes;
#   * llvq-cuda/tests/*, the CUDA-vs-Rust decoder equivalence sweeps. Those
#     need no GPU *by design* — K1 of docs/archive/portage-noyau-cuda.md has clang++
#     compile the .cu text as host C++ — but building the package drags cudarc
#     in, so they are unreachable on Linux. They run on the macOS dev machine
#     and nowhere else. The CUDA decoder's correctness tests are precisely the
#     ones this CI cannot run.
#
# Covering them needs a self-hosted GPU runner, or a macos-* runner for the
# clang++ half (10x minute multiplier on private repos). That is a spending
# decision, not a technical one, so it is left to a human. K2 of
# docs/archive/portage-noyau-cuda.md already scopes the compile-only NVRTC job.
#
# Treating this badge as "everything is checked" would be the same defect
# hard rule 10 of CLAUDE.md is about: an assertion that does not exercise what it appears
# to cover.
# ============================================================================

name: CI

# Docs churn hard here and none of it can change what rustc thinks. A pull
# request runs once (its `pull_request` event); a push runs only on main. Both
# events used to fire on every PR push, two identical 35-45 minute suites side
# by side, and the second one hit the timeout.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'paper/**', 'paper2/**', 'proofs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'paper/**', 'paper2/**', 'proofs/**']

# Read-only, explicitly. No secret, no write scope, nothing that could push,
# publish or bill anything.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Five jobs in parallel, so the wall time is the slowest one, not the sum.
# Each caches its own target directory under its own key: one profile per
# job, and actions/cache saves only after a job succeeds. Rust is pinned:
# `-D warnings` on a floating toolchain turns the tree red overnight on code
# nobody touched. 1.95.0 is the version the workspace is developed and
# measured on. Bump deliberately, in every job.
jobs:
  # The convention, enforced: zero clippy warnings, and the five core crates
  # free of external dependencies (CLAUDE.md, Conventions). Path dependencies render as
  # `name vX (/abs/path)`; anything from crates.io has no path, so any
  # surviving line is a violation. Run against llvq-llm the same check reports
  # 249 external crates, so it does detect what it is meant to detect.
  lint:
    name: clippy + dependency-free core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust 1.95.0
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component clippy
          rustup default 1.95.0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: lint-1.95.0-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: lint-1.95.0-
      - name: clippy (zero warnings is the convention)
        run: >
          cargo clippy --locked
          --workspace --exclude llvq-cuda --exclude llvq-metal
          --all-targets -- -D warnings
      # The measurement-only targets behind the `archive` features (batch 5 of
      # docs/audit-architecture-2026-11.md). Non-blocking: their verdicts are
      # in the journals, and a dependency moving under them should not stop a
      # served change. A red step here says which one stopped compiling.
      - name: archive targets still compile (non-blocking)
        continue-on-error: true
        run: >
          cargo clippy --locked
          --workspace --exclude llvq-cuda --exclude llvq-metal
          --all-targets --features llvq-bench/archive,llvq-llm/archive -- -D warnings
      - name: the dependency-free crates must stay dependency-free
        run: |
          set -euo pipefail
          status=0
          for p in llvq-core llvq-search llvq-quant llvq-artifact llvq-bench; do
            ext=$(cargo tree --locked -p "$p" --edges normal --prefix none \
                  | sed '/^$/d; s/ (\*)$//' | sort -u | grep -v ' (/' || true)
            if [ -n "$ext" ]; then
              echo "::error::$p gained an external dependency:"
              echo "$ext"
              status=1
            fi
          done
          exit $status
      - name: the forbid(unsafe_code) crates keep it
        run: |
          set -euo pipefail
          for f in llvq-core/src/lib.rs llvq-search/src/lib.rs llvq-quant/src/lib.rs \
                   llvq-artifact/src/lib.rs llvq-bench/src/lib.rs \
                   llvq-runtime/src/lib.rs llvq-runtime/src/main.rs; do
            grep -q '^#!\[forbid(unsafe_code)\]' "$f" \
              || { echo "::error::$f lost #![forbid(unsafe_code)]"; exit 1; }
          done

  # The Python that needs no GPU and no torch, and the CUDA image's lists.
  # `ops/llvqtune` skips its torch tests when torch is absent (66 run, 8 skip
  # on 2026-11-07); the MLX door's refusals use the standard library only; and
  # `check_image_lists.py` catches the two-lists trap of ops/Dockerfile.cuda
  # before a paid Space build does. Well under a minute.
  python:
    name: python (llvqtune, MLX door refusals, image lists)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: the CUDA image's three lists agree
        run: python3 ops/check_image_lists.py
      - name: no new tracked file over 1 MB
        run: python3 ops/check_big_files.py
      - name: the MLX door's refusals
        run: python3 ops/mlx_tetra/test_served.py
      - name: llvqtune, without torch
        working-directory: ops/llvqtune
        run: |
          python3 -m pip install --quiet pytest==9.2.0
          PYTHONPATH=. python3 -m pytest -q -p no:cacheprovider

  # The whole CPU suite under `--profile ci` (Cargo.toml): release
  # optimisation, so the tests gated `cfg_attr(debug_assertions, ignore)` run,
  # with overflow checks on and without LTO. Before 2026-11-07 this was a
  # `--release` build with thin LTO and one codegen unit per test binary
  # (23 of 37 minutes), plus a second, debug build of the whole workspace for
  # the overflow checks (9 minutes). `--include-ignored` is deliberately NOT
  # passed: the unconditional #[ignore] tests sweep sealed archives no runner
  # has, and llvq-artifact makes a missing archive a hard failure.
  test:
    name: tests (ci profile, overflow checks on)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust 1.95.0
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: test-ci-1.95.0-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: test-ci-1.95.0-
      - name: tests
        run: >
          cargo test --locked --profile ci
          --workspace --exclude llvq-cuda --exclude llvq-metal
      # The refusal tests that run three archive binaries (classhist, lswap,
      # radixstudy) and one archive example (driftcheck) on a Tetra and a mixed
      # file. Blocking: a tool that silently reads a file it cannot price is the
      # failure these tests exist for.
      - name: archive refusals
        run: |
          cargo build --locked --profile ci -p llvq-bench --features archive --example driftcheck
          cargo test --locked --profile ci -p llvq-bench --features archive --test int4_refusals --test tetra_refusals

  # `debug_assert!` lives almost entirely in the five core crates (search,
  # quant, artifact), which have no external dependency and build in seconds.
  # The overflow checks moved to the ci profile above; this job keeps the
  # debug assertions, where BitWriter::push at width 64 was caught in 2026-08.
  core-debug:
    name: core crates (debug assertions)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust 1.95.0
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: core-debug-1.95.0-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: core-debug-1.95.0-
      - name: tests (debug)
        run: >
          cargo test --locked
          -p llvq-core -p llvq-search -p llvq-quant -p llvq-artifact -p llvq-bench

  # `fast-linalg` is the feature the published models were factorized with,
  # and `both_factorizations_agree`, which pins faer's factor to the
  # dependency-free reference, is cfg(feature = "fast-linalg"). Its own job
  # keeps faer out of the other caches.
  faer:
    name: llvq-quant with fast-linalg (faer against the reference)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust 1.95.0
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: faer-1.95.0-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: faer-1.95.0-
      - name: tests
        run: >
          cargo test --locked --profile ci
          -p llvq-quant --features fast-linalg
