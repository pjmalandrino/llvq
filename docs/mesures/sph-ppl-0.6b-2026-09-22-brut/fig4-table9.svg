<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="980" height="540" role="img" font-family='ui-sans-serif, system-ui, "Segoe UI", Helvetica, Arial, sans-serif'><style>@media (prefers-color-scheme: dark){.f-surface{fill:#1a1a19}.s-surface{stroke:#1a1a19}.f-ink{fill:#ffffff}.s-ink{stroke:#ffffff}.f-ink2{fill:#c3c2b7}.s-ink2{stroke:#c3c2b7}.f-grid{fill:#44443f}.s-grid{stroke:#44443f}.f-s1{fill:#3987e5}.s-s1{stroke:#3987e5}.f-s2{fill:#d95926}.s-s2{stroke:#d95926}.f-s3{fill:#199e70}.s-s3{stroke:#199e70}.f-on1{fill:#ffffff}.s-on1{stroke:#ffffff}}.bar:hover{opacity:.75}</style><rect class="f-surface" width="980" height="540" fill="#fcfcfb"/><text x="40.0" y="40.0" font-size="21" text-anchor="start" class="f-ink" fill="#0b0b0b" font-weight="650">La Table 9 du papier ne remplit qu’une diagonale</text><text x="40.0" y="66.0" font-size="14.5" text-anchor="start" class="f-ink2" fill="#52514e">Le +1,9 pp que nos documents lui font dire paie deux changements à la fois, pas la rétraction seule.</text><text x="490.0" y="167.0" font-size="15" text-anchor="middle" class="f-ink" fill="#0b0b0b" font-weight="600">recherche euclidienne</text><text x="764.0" y="167.0" font-size="15" text-anchor="middle" class="f-ink" fill="#0b0b0b" font-weight="600">recherche angulaire</text><text x="340.0" y="240.0" font-size="15" text-anchor="end" class="f-ink" fill="#0b0b0b" font-weight="600">correction : GPTQ</text><rect x="360.0" y="185.0" width="260.0" height="100.0" rx="8" class="f-s1" fill="#2a78d6"/><text x="490.0" y="241.0" font-size="16" text-anchor="middle" class="f-on1" fill="#ffffff" font-weight="650">34,1 MMLU</text><rect x="634.0" y="185.0" width="260.0" height="100.0" rx="8" class="s-grid" fill="none" stroke="#dedcd6" stroke-width="2" stroke-dasharray="6 5"/><text x="764.0" y="241.0" font-size="16" text-anchor="middle" class="f-ink2" fill="#52514e" font-weight="650">jamais mesuré</text><text x="340.0" y="354.0" font-size="15" text-anchor="end" class="f-ink" fill="#0b0b0b" font-weight="600">correction : Spherical GPTQ</text><rect x="360.0" y="299.0" width="260.0" height="100.0" rx="8" class="s-grid" fill="none" stroke="#dedcd6" stroke-width="2" stroke-dasharray="6 5"/><text x="490.0" y="355.0" font-size="16" text-anchor="middle" class="f-ink2" fill="#52514e" font-weight="650">jamais mesuré</text><rect x="634.0" y="299.0" width="260.0" height="100.0" rx="8" class="f-s1" fill="#2a78d6"/><text x="764.0" y="355.0" font-size="16" text-anchor="middle" class="f-on1" fill="#ffffff" font-weight="650">36,0 MMLU</text><text x="40.0" y="432.0" font-size="14" text-anchor="start" class="f-s2" fill="#eb6834" font-weight="600">Les deux cases bleues sont la paire que le papier compare. Elles diffèrent par la ligne ET par la colonne.</text><text x="40.0" y="458.0" font-size="13.5" text-anchor="start" class="f-ink2" fill="#52514e">Les six paires de la table bougent la métrique de recherche et la correction ensemble : elle ne peut attribuer son écart ni à l’une ni à l’autre.</text><text x="40.0" y="482.0" font-size="13.5" text-anchor="start" class="f-ink2" fill="#52514e">Notre bras sph n’a changé que la ligne. L’encodeur Tetra est déjà l’angulaire : cos θ = 0,961, mesuré.</text><text x="40.0" y="506.0" font-size="13.5" text-anchor="start" class="f-ink2" fill="#52514e">Deux endroits du dépôt reposent sur cette lecture : ROADMAP-QUALITY ligne 3, et la ligne Spherical GPTQ +1,90 du journal des row scales.</text></svg>