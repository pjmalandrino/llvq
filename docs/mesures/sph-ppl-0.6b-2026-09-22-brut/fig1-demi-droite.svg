<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 752" width="980" height="752" role="img" font-family='ui-sans-serif, system-ui, "Segoe UI", Helvetica, Arial, sans-serif'><style>@media (prefers-color-scheme: dark){.f-surface{fill:#1a1a19}.s-surface{stroke:#1a1a19}.f-ink{fill:#ffffff}.s-ink{stroke:#ffffff}.f-ink2{fill:#c3c2b7}.s-ink2{stroke:#c3c2b7}.f-grid{fill:#44443f}.s-grid{stroke:#44443f}.f-s1{fill:#3987e5}.s-s1{stroke:#3987e5}.f-s2{fill:#d95926}.s-s2{stroke:#d95926}.f-s3{fill:#199e70}.s-s3{stroke:#199e70}.f-on1{fill:#ffffff}.s-on1{stroke:#ffffff}}.bar:hover{opacity:.75}</style><rect class="f-surface" width="980" height="752" fill="#fcfcfb"/><text x="40.0" y="40.0" font-size="21" text-anchor="start" class="f-ink" fill="#0b0b0b" font-weight="650">Où chaque design pose le point, et contre quoi la boucle compense</text><text x="40.0" y="66.0" font-size="14.5" text-anchor="start" class="f-ink2" fill="#52514e">Un bloc de 24 poids. Toute la décision tient sur la demi-droite portée par la direction codée u.</text><line x1="95.0" y1="235.0" x2="395.0" y2="235.0" class="s-ink2" stroke="#52514e" stroke-width="1.8" stroke-linecap="round"/><path d="M 395 235 l -10 -5 v 10 z" class="f-ink2" fill="#52514e"/><text x="405.0" y="240.0" font-size="15" text-anchor="start" class="f-ink2" fill="#52514e" font-weight="600">u</text><line x1="95.0" y1="235.0" x2="298.5" y2="117.5" class="s-ink" stroke="#0b0b0b" stroke-width="2.2" stroke-linecap="round"/><circle cx="298.5" cy="117.5" r="5" class="f-ink" fill="#0b0b0b"/><text x="310.5" y="113.5" font-size="14" text-anchor="start" class="f-ink" fill="#0b0b0b" font-weight="600">x, le bloc</text><line x1="298.5" y1="117.5" x2="298.5" y2="235.0" class="s-s2" stroke="#eb6834" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="4 4"/><text x="310.5" y="172.2" font-size="13" text-anchor="start" class="f-s2" fill="#eb6834">erreur angulaire</text><text x="310.5" y="189.2" font-size="13" text-anchor="start" class="f-s2" fill="#eb6834">0,277 · ‖x‖</text><path d="M 139 235 A 44 44 0 0 0 133.1 213.0" class="s-ink2" fill="none" stroke="#52514e" stroke-width="1.4" stroke-linecap="round"/><text x="148.0" y="224.0" font-size="14" text-anchor="start" class="f-ink2" fill="#52514e">θ</text><line x1="95.0" y1="229.0" x2="95.0" y2="241.0" class="s-ink2" stroke="#52514e" stroke-width="1.8" stroke-linecap="round"/><text x="95.0" y="260.0" font-size="14" text-anchor="middle" class="f-ink" fill="#0b0b0b">0</text><line x1="290.5" y1="229.0" x2="290.5" y2="241.0" class="s-ink2" stroke="#52514e" stroke-width="1.8" stroke-linecap="round"/><line x1="298.5" y1="229.0" x2="298.5" y2="241.0" class="s-ink2" stroke="#52514e" stroke-width="1.8" stroke-linecap="round"/><line x1="290.5" y1="243.0" x2="274.5" y2="257.0" class="s-grid" stroke="#dedcd6" stroke-width="1.3" stroke-linecap="round"/><text x="270.5" y="262.0" font-size="14" text-anchor="end" class="f-ink" fill="#0b0b0b">t</text><line x1="298.5" y1="243.0" x2="314.5" y2="275.0" class="s-grid" stroke="#dedcd6" stroke-width="1.3" stroke-linecap="round"/><text x="318.5" y="280.0" font-size="14" text-anchor="start" class="f-ink" fill="#0b0b0b">‖x‖</text><text x="95.0" y="313.0" font-size="13" text-anchor="start" class="f-ink2" fill="#52514e">t = ‖x‖ · cos θ, l’optimum sur la droite.</text><text x="95.0" y="332.0" font-size="13" text-anchor="start" class="f-ink2" fill="#52514e">θ est dessiné large pour la lisibilité ; mesuré à 16,1°.</text><text x="470.0" y="118.0" font-size="15" text-anchor="start" class="f-ink" fill="#0b0b0b">Le fichier stocke ĝ · u : une direction codée et une</text><text x="470.0" y="140.0" font-size="15" text-anchor="start" class="f-ink" fill="#0b0b0b">magnitude ĝ. Deux quantités peuvent diverger.</text><circle cx="479.0" cy="175.0" r="8.5" class="f-s1" fill="#2a78d6"/><text x="498.0" y="180.0" font-size="15" text-anchor="start" class="f-ink" fill="#0b0b0b" font-weight="600">ce que le fichier stocke</text><path d="M 479 205 l -7 -11 h 14 z" class="f-s2" fill="#eb6834"/><text x="498.0" y="208.0" font-size="15" text-anchor="start" class="f-ink" fill="#0b0b0b" font-weight="600">ce contre quoi la boucle compense</text><text x="470.0" y="242.0" font-size="15" text-anchor="start" class="f-ink2" fill="#52514e">Si les deux coïncident, le design est cohérent.</text><text x="470.0" y="264.0" font-size="15" text-anchor="start" class="f-ink2" fill="#52514e">Sinon la boucle corrige un fichier qui n’existe pas.</text><text x="40.0" y="372.0" font-size="15" text-anchor="start" class="f-ink" fill="#0b0b0b" font-weight="650">Les trois designs, sur la même règle</text><text x="40.0" y="393.0" font-size="13" text-anchor="start" class="f-ink2" fill="#52514e">position en unités de ‖x‖, la norme du bloc</text><line x1="300.0" y1="478.0" x2="860.0" y2="478.0" class="s-grid" stroke="#dedcd6" stroke-width="2" stroke-linecap="round"/><text x="40.0" y="458.0" font-size="15" text-anchor="start" class="f-ink" fill="#0b0b0b" font-weight="600">A. publié (nogs)</text><text x="40.0" y="480.0" font-size="13" text-anchor="start" class="f-ink2" fill="#52514e">48 bits/bloc</text><text x="40.0" y="501.0" font-size="13.5" text-anchor="start" class="f-ink2" fill="#52514e">cohérent</text><circle cx="393.3" cy="478.0" r="5.5" class="s-ink2" fill="none" stroke="#52514e" stroke-width="1.6"/><circle cx="682.0" cy="478.0" r="5.5" class="s-ink2" fill="none" stroke="#52514e" stroke-width="1.6"/><line x1="500.1" y1="468.0" x2="500.1" y2="488.0" class="s-grid" stroke="#dedcd6" stroke-width="1.6" stroke-linecap="round"/><line x1="548.9" y1="468.0" x2="548.9" y2="488.0" class="s-grid" stroke="#dedcd6" stroke-width="1.6" stroke-linecap="round"/><text x="492.1" y="508.0" font-size="13" text-anchor="end" class="f-ink2" fill="#52514e">t</text><text x="556.9" y="508.0" font-size="13" text-anchor="start" class="f-ink2" fill="#52514e">‖x‖</text><text x="393.3" y="438.0" font-size="13" text-anchor="middle" class="f-ink2" fill="#52514e">niveau 0</text><text x="682.0" y="438.0" font-size="13" text-anchor="middle" class="f-ink2" fill="#52514e">niveau 1</text><text x="537.7" y="416.0" font-size="13" text-anchor="middle" class="f-ink2" fill="#52514e">les deux magnitudes que le mot de 48 bits sait dire</text><circle cx="682.0" cy="478.0" r="8.5" class="f-s1 s-surface" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><path d="M 682.0 463 l -7 -11 h 14 z" class="f-s2" fill="#eb6834"/><line x1="300.0" y1="566.0" x2="860.0" y2="566.0" class="s-grid" stroke="#dedcd6" stroke-width="2" stroke-linecap="round"/><text x="40.0" y="546.0" font-size="15" text-anchor="start" class="f-ink" fill="#0b0b0b" font-weight="600">B. magnitude libre</text><text x="40.0" y="568.0" font-size="13" text-anchor="start" class="f-ink2" fill="#52514e">47 + 16 bits/bloc</text><text x="40.0" y="589.0" font-size="13.5" text-anchor="start" class="f-ink2" fill="#52514e">cohérent</text><circle cx="393.3" cy="566.0" r="5.5" class="s-ink2" fill="none" stroke="#52514e" stroke-width="1.6"/><circle cx="682.0" cy="566.0" r="5.5" class="s-ink2" fill="none" stroke="#52514e" stroke-width="1.6"/><line x1="500.1" y1="556.0" x2="500.1" y2="576.0" class="s-grid" stroke="#dedcd6" stroke-width="1.6" stroke-linecap="round"/><line x1="548.9" y1="556.0" x2="548.9" y2="576.0" class="s-grid" stroke="#dedcd6" stroke-width="1.6" stroke-linecap="round"/><circle cx="548.9" cy="566.0" r="8.5" class="f-s1 s-surface" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><path d="M 548.9 551 l -7 -11 h 14 z" class="f-s2" fill="#eb6834"/><line x1="300.0" y1="654.0" x2="860.0" y2="654.0" class="s-grid" stroke="#dedcd6" stroke-width="2" stroke-linecap="round"/><text x="40.0" y="634.0" font-size="15" text-anchor="start" class="f-ink" fill="#0b0b0b" font-weight="600">sph, ce qui a été mesuré</text><text x="40.0" y="656.0" font-size="13" text-anchor="start" class="f-ink2" fill="#52514e">48 bits/bloc</text><text x="40.0" y="677.0" font-size="13.5" text-anchor="start" class="f-s2" fill="#eb6834" font-weight="600">incohérent</text><circle cx="393.3" cy="654.0" r="5.5" class="s-ink2" fill="none" stroke="#52514e" stroke-width="1.6"/><circle cx="682.0" cy="654.0" r="5.5" class="s-ink2" fill="none" stroke="#52514e" stroke-width="1.6"/><line x1="500.1" y1="644.0" x2="500.1" y2="664.0" class="s-grid" stroke="#dedcd6" stroke-width="1.6" stroke-linecap="round"/><line x1="548.9" y1="644.0" x2="548.9" y2="664.0" class="s-grid" stroke="#dedcd6" stroke-width="1.6" stroke-linecap="round"/><rect x="548.9" y="640.0" width="133.2" height="28.0" rx="3" class="f-s2" fill="#eb6834" opacity="0.18"/><text x="615.5" y="704.0" font-size="13.5" text-anchor="middle" class="f-s2" fill="#eb6834" font-weight="600">l’écart : (‖x‖ − ĝ) · u</text><circle cx="682.0" cy="654.0" r="8.5" class="f-s1 s-surface" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><path d="M 548.9 639 l -7 -11 h 14 z" class="f-s2" fill="#eb6834"/><text x="40.0" y="728.0" font-size="13.5" text-anchor="start" class="f-ink2" fill="#52514e">Le design B est la ligne 5 de l’Algorithme 3 appliquée à la lettre : elle écrit dans les poids stockés, et coûte 16 bits par bloc.</text></svg>