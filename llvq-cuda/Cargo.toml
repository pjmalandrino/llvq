[package]
name = "llvq-cuda"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CUDA port of the LLVQ fused kernel: the same Leech decoder, measured on an NVIDIA GPU."

# `llvq-bench` builds the F1 universal-table decoder's rank tables
# (`llvq_bench::f1::rank`), which three bench binaries upload and check the
# card's decode against: `planesbench`, `f1rankfloor` and `f1floorbench`. The
# library never names it, so it sits behind the default feature `bench`, and
# `llvq-llm` takes this crate with `default-features = false`: the served build
# does not compile the bench crate (audit batch 7, 2026-11-08). The image's
# `cargo build -p llvq-cuda` keeps the default and builds the three as before.
# The `tests/f1rank*_matches_rust.rs` sweeps reach it as a dev-dependency.
[features]
default = ["bench"]
bench = ["dep:llvq-bench"]

[dependencies]
llvq-bench = { path = "../llvq-bench", optional = true }

# NVIDIA-only by construction, and target-gated rather than feature-gated on
# purpose: cudarc cannot build on macOS at all, whichever way it is asked.
# Read in cudarc-0.19.8/build.rs, three distinct walls:
#
#   * with the default features declared below, no CUDA version is pinned, so
#     :118 panics with "Must specify one of the following features" unless
#     $CUDARC_CUDA_VERSION is set (:56);
#   * once `cuda-version-from-build-system` unifies in — candle enables it —
#     the script shells out to `nvcc --version` and panics at :168 without it;
#   * and `dynamic_linking` emits `-l dylib=cuda/nvrtc/cublas` (:186-213),
#     libraries no Mac has.
#
# A Cargo feature would not help, because features are resolved on the host
# too: the dependency has to be invisible to the build resolver anywhere but
# Linux. Under this cfg it is — `cargo tree -p llvq-cuda` on the dev Mac shows
# a single node, and the same command `--target x86_64-unknown-linux-gnu`
# shows cudarc 0.19.8 (already in Cargo.lock via candle, so no new resolution).
#
# The feature list is candle's, verbatim (candle-core-0.9.2/Cargo.toml:159-172,
# minus `f8` which nothing here uses). Not a preference — a constraint. Cargo
# unifies the features of a shared dependency across workspace members built
# together, and cudarc's build.rs panics outright on the pairs
# {dynamic-loading, dynamic-linking}, {dynamic-loading, static-linking} and
# {dynamic-linking, static-linking} (build.rs:81-93). Declaring the same set
# candle already declares is the only choice that cannot produce such a pair,
# and it is the set the 8B and 32B runs have already built successfully in
# `nvidia/cuda:12.4.1-devel` — which is stronger evidence than reasoning,
# since none of it can be compiled on the dev Mac.
#
# `cuda-version-from-build-system` shells out to `nvcc --version`; nvcc is
# present in the *devel* build stage and absent from the runtime stage, which
# is fine because the probe happens at build time. Pinning `cuda-12040`
# instead would remove the probe and match the image exactly; it is the more
# reproducible choice and the one to revisit at K3, but it would then differ
# from candle's and risk the unification above.
[target.'cfg(target_os = "linux")'.dependencies]
cudarc = { version = "0.19", default-features = false, features = [
    "std",
    "driver",
    "nvrtc",
    "cublas",
    "cublaslt",
    "f16",
    "cuda-version-from-build-system",
    "dynamic-linking",
] }
llvq-core = { path = "../llvq-core" }
llvq-search = { path = "../llvq-search" }
llvq-artifact = { path = "../llvq-artifact" }
# `bin/rotbench` needs the rotation the quantizer used — not a reimplementation
# of it. No new closure: `llvq-artifact` already pulls `llvq-quant` in for
# `decode_matrix`, so this only names what was reachable anyway.
llvq-quant = { path = "../llvq-quant" }

# Portable, and unconditional on purpose: the CUDA sources are checked against
# the Rust decoder by compiling them as host C++ with `clang++`, and that test
# has to run on the development machine — which is exactly the machine with no
# CUDA. None of these three crates pulls in an external dependency.
[dev-dependencies]
llvq-bench = { path = "../llvq-bench" }
llvq-core = { path = "../llvq-core" }
llvq-search = { path = "../llvq-search" }
llvq-artifact = { path = "../llvq-artifact" }
# The rotation kernel's specification. `Rotation` is what quantized the sealed
# artifact, so it is not a reimplementation to diff against — it is the basis
# the stored weights are in.
llvq-quant = { path = "../llvq-quant" }

[[bin]]
name = "planesbench"
path = "src/bin/planesbench.rs"
required-features = ["bench"]

[[bin]]
name = "f1rankfloor"
path = "src/bin/f1rankfloor.rs"
required-features = ["bench"]

[[bin]]
name = "f1floorbench"
path = "src/bin/f1floorbench.rs"
required-features = ["bench"]
