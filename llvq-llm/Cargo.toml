[package]
name = "llvq-llm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
llvq-core = { path = "../llvq-core" }
llvq-search = { path = "../llvq-search" }
llvq-artifact = { path = "../llvq-artifact" }
llvq-quant = { path = "../llvq-quant" }
candle-core = "0.9"
half = "2"
candle-nn = "0.9"
candle-transformers = "0.9"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
hf-hub = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
flate2 = "1"
parquet = { version = "55", default-features = false, features = ["snap", "zstd", "brotli", "flate2"] }

# The fused kernels. Target-gated *and* optional: `llvq-cuda` pulls cudarc,
# which cannot build on macOS whichever way it is asked, and there is no point
# pulling it on a Linux CPU build either.
[target.'cfg(target_os = "linux")'.dependencies]
llvq-cuda = { path = "../llvq-cuda", optional = true }

# The Metal half of the fused path, under its OWN target table.
#
# It sat under the linux one for a few minutes, which would have pulled both
# crates where they are useless and left them absent where they are required.
# `candle-core` re-exports MetalDevice, MetalStorage and MetalError and
# nothing else: Buffer, ComputePipeline and ComputeCommandEncoder live in
# `candle_metal_kernels::metal`, and MTLSize, MTLResourceUsage and
# MTLCompileOptions in `objc2_metal`. Both are already in Cargo.lock at these
# versions, pulled by `candle-core/metal`, so naming them adds no resolution.
# `llvq-metal` is NOT usable here: it pins metal-rs 0.29, whose Buffer is a
# different type from candle's.
[target.'cfg(target_os = "macos")'.dependencies]
candle-metal-kernels = { version = "0.9.2", optional = true }
objc2-metal = { version = "0.3", optional = true }

[features]
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal",
         "dep:candle-metal-kernels", "dep:objc2-metal"]
# The remote target. `cudnn` is separate because it needs the cuDNN libraries
# present at build time, which the plain CUDA base images do not all carry.
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda", "dep:llvq-cuda"]
cudnn = ["cuda", "candle-core/cudnn"]
fast-linalg = ["llvq-quant/fast-linalg"]

# Portable and unconditional, exactly as `llvq-cuda` takes the core crates in
# ITS dev-dependencies and for the same reason. The comment above is about the
# shipped graph: `cudarc` is target-gated INSIDE `llvq-cuda`, so on macOS that
# crate builds without it — which is why `cargo test -p llvq-cuda` runs here.
#
# What it buys: `llvq_cuda::embedded_source` is deliberately un-gated, "so a
# Mac can assert the table is complete". `tests/served_unit.rs` compiles the
# served translation unit from THOSE texts rather than from a list retyped by
# hand, on a machine with no card.
[dev-dependencies]
# Test-only, for the rank tables the Metal gate uploads. No cycle:
# `llvq-bench` does not name this crate.
llvq-bench = { path = "../llvq-bench" }
llvq-cuda = { path = "../llvq-cuda" }
