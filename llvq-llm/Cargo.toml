[package]
name = "llvq-llm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
llvq-core = { path = "../llvq-core" }
llvq-search = { path = "../llvq-search" }
llvq-artifact = { path = "../llvq-artifact" }
llvq-quant = { path = "../llvq-quant" }
candle-core = "0.9"
half = "2"
candle-nn = "0.9"
candle-transformers = "0.9"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
hf-hub = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
flate2 = "1"
parquet = { version = "55", default-features = false, features = ["snap", "zstd", "brotli", "flate2"] }

# The fused kernels. Target-gated *and* optional: `llvq-cuda` pulls cudarc,
# which cannot build on macOS whichever way it is asked, and there is no point
# pulling it on a Linux CPU build either.
[target.'cfg(target_os = "linux")'.dependencies]
llvq-cuda = { path = "../llvq-cuda", optional = true }

[features]
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
# The remote target. `cudnn` is separate because it needs the cuDNN libraries
# present at build time, which the plain CUDA base images do not all carry.
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda", "dep:llvq-cuda"]
cudnn = ["cuda", "candle-core/cudnn"]
fast-linalg = ["llvq-quant/fast-linalg"]
