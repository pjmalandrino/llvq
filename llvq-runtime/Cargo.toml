[package]
name = "llvq-runtime"
version = "0.1.3"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "llvq: pull, run and serve the sealed LLVQ files with Ollama's commands and API"

[[bin]]
name = "llvq"
path = "src/main.rs"

[dependencies]
# Also the one source of `candle-core` and `tokenizers`, re-exported as `llvq_llm::candle` and
# `llvq_llm::tokenizers`, so their versions and features are stated once, in llvq-llm.
llvq-llm = { path = "../llvq-llm" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "signal"] }
futures-util = "0.3"
# Without `color`: plain help and errors, and five crates fewer.
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
utoipa = "5"
utoipa-axum = "0.2"
sha2 = "0.10"
# Both already in Cargo.lock at these versions, pulled by hf-hub's sync API.
ureq = { version = "2", default-features = false, features = ["native-tls", "json"] }
native-tls = "0.2"

# The device backends, carried through to the engine.
[features]
metal = ["llvq-llm/metal"]
cuda = ["llvq-llm/cuda"]

[dev-dependencies]
candle-nn = "0.9"
candle-transformers = "0.9"
serde_yaml = "0.9"

# Every target of the package, not only the lib and the bin: tests, examples, build script.
[lints.rust]
unsafe_code = "forbid"
