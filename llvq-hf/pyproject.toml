[project]
name = "llvq-hf"
version = "0.1.0"
description = "Reads a Tetra-quantized LLVQ model in transformers, still compressed on disk"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "safetensors>=0.4"]

[project.optional-dependencies]
torch = ["torch>=2.5", "transformers>=5.0"]

[dependency-groups]
# `ninja` is what torch.utils.cpp_extension.load shells out to for the Metal op.
dev = ["pytest>=8", "torch>=2.5", "transformers>=5.0", "ninja>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llvqhf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
