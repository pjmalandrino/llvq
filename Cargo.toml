[workspace]
resolver = "2"
members = [
    "llvq-core",
    "llvq-search",
    "llvq-bench",
    "llvq-quant",
    "llvq-artifact",
    "llvq-metal",
    "llvq-cuda",
    "llvq-llm",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pjmalandrino/llvq"

[profile.release]
lto = "thin"
codegen-units = 1
