[workspace]
resolver = "2"
members = [
    "llvq-core",
    "llvq-search",
    "llvq-bench",
    "llvq-quant",
    "llvq-artifact",
    "llvq-metal",
    "llvq-cuda",
    "llvq-llm",
    "llvq-runtime",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pjmalandrino/llvq-tetra"

[profile.release]
lto = "thin"
codegen-units = 1

# The shipped `llvq` archives (`cargo build --profile dist -p llvq-runtime`).
# The release optimisation level, plus whole-program LTO and no symbol table:
# a smaller binary. Floating-point results do not depend on LTO (see `ci`
# below). `panic` stays `unwind`: the engine thread of `llvq serve` catches a
# panic of the model and answers it as an error, and the server lives on.
# Every published measurement stays on `release`.
[profile.dist]
inherits = "release"
lto = "fat"
strip = "symbols"

# CI only (`cargo test --profile ci`). The release optimisation level, so the
# tests gated `cfg_attr(debug_assertions, ignore)` run, without the link-time
# work that made each of ~40 test binaries take minutes: no LTO, 16 codegen
# units. Overflow checks are on, which used to need a separate debug build of
# the whole workspace. Floating-point results do not depend on LTO or on the
# number of codegen units.
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
incremental = false
overflow-checks = true
